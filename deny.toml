[advisories]
db-path = "target/cargo-deny/advisory-dbs"
db-urls = ["https://git.tdengine.net/taosdata/deps/advisory-db"]
unmaintained = "none"
ignore = [
    # h2 unbounded empty DATA frames - warp 0.3.7 (dev-dep only) locked to hyper 0.14 which uses h2 0.3.x
    "RUSTSEC-2026-0258",
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/taosdata/tokio-tungstenite.git",
    "https://github.com/taosdata/tungstenite-rs.git",
]
